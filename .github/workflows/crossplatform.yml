name: Cross-platform compilation test (Ferron 3.x)

on:
  push:
    branches: ["develop-3.x"]
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "bin/**"
      - "core/**"
      - "cross-build/**"
      - "entrypoint/**"
      - "modules/**"
      - "types/**"
      - ".github/workflows/crossplatform.yml"
  pull_request:
    branches: ["develop-3.x"]
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "bin/**"
      - "core/**"
      - "cross-build/**"
      - "entrypoint/**"
      - "modules/**"
      - "types/**"
      - ".github/workflows/crossplatform.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            cross-build: true
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            cross-build: true
          - target: i686-unknown-linux-gnu
            runner: ubuntu-latest
            cross-build: true
          - target: i686-unknown-linux-musl
            runner: ubuntu-latest
            cross-build: true
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            cross-build: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            cross-build: true
          - target: armv7-unknown-linux-gnueabihf
            runner: ubuntu-latest
            cross-build: true
          - target: armv7-unknown-linux-musleabihf
            runner: ubuntu-latest
            cross-build: true
          - target: riscv64gc-unknown-linux-gnu
            runner: ubuntu-latest
            cross-build: true
          - target: riscv64gc-unknown-linux-musl
            runner: ubuntu-latest
            cross-build: true
          - target: s390x-unknown-linux-gnu
            runner: ubuntu-latest
            cross-build: true
          - target: powerpc64le-unknown-linux-gnu
            runner: ubuntu-latest
            cross-build: true
          - target: x86_64-unknown-freebsd
            runner: ubuntu-latest
            cross-build: true
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: i686-pc-windows-msvc
            runner: windows-latest
          - target: aarch64-pc-windows-msvc
            runner: windows-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-apple-darwin
            runner: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: "${{ matrix.target }}"

      - name: Setup sysroot cache
        if: matrix.cross-build == 'true'
        uses: actions/cache@v5
        with:
          path: |
            cross-build/sysroots/prepared
          key: SysrootsFerron3-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: SysrootsFerron3-${{ runner.os }}-${{ matrix.target }}-

      - name: Setup cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: CompileTestFerron3-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: CompileTestFerron3-${{ runner.os }}-${{ matrix.target }}-

      - name: Setup NASM
        if: matrix.runner == 'windows-latest'
        uses: ilammy/setup-nasm@v1

      - name: Install packages for cross-compilation
        if: matrix.cross-build == 'true'
        uses: eclipse-score/apt-install
        with:
          packages: debootstrap clang lld libclang-dev wrk nghttp2-client openssl python3 llvm qemu-user-static cmake

      - name: Install bindgen-cli
        shell: bash
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall --no-confirm bindgen-cli --force

      - name: Build binaries (cross)
        if: matrix.cross-build == 'true'
        shell: bash
        run: |
          ./cross-build/build.sh ${{ matrix.target }}

      - name: Build binaries (native)
        if: matrix.cross-build != 'true'
        shell: bash
        run: |
          cargo build --target ${{ matrix.target }} --verbose
