name: Nightly fuzzing

# Nightly cargo-fuzz runs for high-risk targets
on:
  schedule:
    - cron: "0 3 * * *" # daily at 03:00 UTC
  workflow_dispatch:

concurrency:
  group: nightly-fuzz
  cancel-in-progress: true

jobs:
  fuzz:
    name: Nightly fuzzers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld build-essential pkg-config libclang-dev

      - name: Setup Rust nightly
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --force

      - name: Build workspace
        run: cargo +nightly build --workspace --release

      - name: Run http-ratelimit fuzz
        working-directory: modules/http-ratelimit/fuzz
        run: |
          cargo +nightly fuzz run rate_limit_concurrent -- -max_total_time=3600 -workers=2

      - name: Run http-server fuzz
        working-directory: modules/http-server/fuzz
        run: |
          cargo +nightly fuzz run canonicalize_path -- -max_total_time=3600 -workers=2
          cargo +nightly fuzz run canonicalize_path_routing -- -max_total_time=3600 -workers=2
          cargo +nightly fuzz run proxy_protocol -- -max_total_time=3600 -workers=2

      - name: Run http-cache fuzz
        working-directory: modules/http-cache/fuzz
        run: |
          cargo +nightly fuzz run cache_key_roundtrip -- -max_total_time=3600 -workers=2
          cargo +nightly fuzz run lscache_parsers -- -max_total_time=3600 -workers=2
          cargo +nightly fuzz run policy_evaluation -- -max_total_time=3600 -workers=2

      - name: Run http-proxy fuzz
        working-directory: modules/http-proxy/fuzz
        run: |
          cargo +nightly fuzz run consistent_hash_ring -- -max_total_time=3600 -workers=2
          cargo +nightly fuzz run p2c_ewma -- -max_total_time=3600 -workers=2
          cargo +nightly fuzz run selector -- -max_total_time=3600 -workers=2
          cargo +nightly fuzz run weighted_round_robin -- -max_total_time=3600 -workers=2

      - name: Upload fuzz artifacts
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: |
            modules/**/fuzz/artifacts
            modules/**/fuzz/corpus
