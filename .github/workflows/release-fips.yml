name: Release (Ferron 3.x; FIPS-certified cryptography)

on:
  push:
    branches: ["3.x"]
    paths:
      - ".dockerignore"
      - "bin/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "configs/**"
      - "core/**"
      - "Cross.toml"
      - "cross-build/**"
      - "Dockerfile"
      - "Dockerfile.*"
      - "e2e/**"
      - "entrypoint/**"
      - "modules/**"
      - "packaging/**"
      - "types/**"
      - "utils/**"
      - "wwwroot/**"
      - ".github/workflows/release-fips.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            cross-build: true
            pgo: true
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            cross-build: true
            pgo: true
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            cross-build: true
            pgo: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            cross-build: true
            pgo: true
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          # Fails to build due to Ninja issues (`aws-lc-fips-sys` forces usage of Ninja as generator)
          #- target: aarch64-pc-windows-msvc
          #  runner: windows-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-apple-darwin
            runner: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: 3.x
          fetch-depth: 0
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: "${{ matrix.target }}"

      - name: Setup sysroot cache
        if: matrix.cross-build == true
        uses: actions/cache@v5
        with:
          path: |
            cross-build/sysroots/prepared
          key: SysrootsFerron3FR-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('cross-build/sysroots/prepare-*.sh') }}
          restore-keys: SysrootsFerron3FR-${{ runner.os }}-${{ matrix.target }}-

      - name: Setup cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ReleaseFerron3-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ReleaseFerron3-${{ runner.os }}-${{ matrix.target }}-

      - name: Determine Ferron version
        shell: bash
        run: |
          FERRON_VERSION_CARGO="$(cat entrypoint/Cargo.toml | grep -E '^version' | sed -E 's|.*"([0-9a-zA-Z.+-]+)"$|\1|g')"
          FERRON_VERSION_GIT="$(git tag --sort=-committerdate | head -n 1 | sed s/[^0-9a-zA-Z.+-]//g)"
          if [ "$FERRON_VERSION_CARGO" != "" ]; then
            echo "Version determined from Cargo.toml file"
            echo "FERRON_VERSION=$FERRON_VERSION_CARGO" >> $GITHUB_ENV
          elif  [ "$FERRON_VERSION_GIT" != "" ]; then
            echo "Version determined from the Git tag"
            echo "FERRON_VERSION=$FERRON_VERSION_GIT" >> $GITHUB_ENV
          else
            echo "Can't determine the server version!" 2>&1
            exit 1
          fi

      # AWS-LC FIPS requires Go...
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Setup NASM
        if: matrix.runner == 'windows-latest'
        uses: ilammy/setup-nasm@v1

      - name: Setup Just
        uses: extractions/setup-just@v4

      - name: Install packages for cross-compilation
        if: matrix.cross-build == true
        uses: eclipse-score/apt-install@main
        with:
          packages: debootstrap clang-20 lld-20 libclang-20-dev wrk nghttp2-client openssl python3 llvm qemu-user-static cmake curl

      - name: Install Cross
        if: matrix.cross-rs == true
        shell: bash
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall --no-confirm cross --force

      - name: Install bindgen-cli
        shell: bash
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall --no-confirm bindgen-cli --force

      - name: Install cargo-cyclonedx
        shell: bash
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall --no-confirm cargo-cyclonedx --force

      - name: Build binaries (cross-build)
        if: matrix.cross-build == true && matrix.cross-rs != true
        shell: bash
        run: |
          # Before building, a sysroot has to be prepared
          LIBC=gnu
          if echo ${{ matrix.target }} | grep -q 'musl'; then
            LIBC=musl
          fi
          if ! [ -d ./cross-build/sysroots/prepared/${LIBC}-${{ matrix.target }} ]; then
            # Sysroot doesn't exist, prepare it
            ./cross-build/sysroots/prepare-${LIBC}.sh ${{ matrix.target }}
          fi
          export CLANG=/usr/bin/clang-20
          export CLANGXX=/usr/bin/clang++-20
          export LLVM_PROFDATA=/usr/bin/llvm-profdata-20
          if [ "${{ matrix.pgo }}" = "true" ]; then
            ./cross-build/build.sh ${{ matrix.target }} --pgo --fips
          else
            ./cross-build/build.sh ${{ matrix.target }} --fips
          fi

      - name: Build binaries (cross-rs)
        if: matrix.cross-rs == true && matrix.cross-build != true
        shell: bash
        run: |
          cross build --release --target ${{ matrix.target }} --verbose --features=fips

      - name: Build binaries (native)
        if: matrix.cross-build != true && matrix.cross-rs != true
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }} --verbose --features=fips

      - name: Create a release archive
        shell: bash
        run: |
          just package ${{ matrix.target }} true

      - name: Create a Windows installer
        if: matrix.runner == 'windows-latest'
        shell: bash
        run: |
          just package-windows ${{ matrix.target }} true

      - name: Generate SBOMs
        shell: bash
        run: |
          just package-sbom ${{ matrix.target }} true

      - name: Set up SSH
        uses: LuisEnMarroquin/setup-ssh-action@v3.0.0
        with:
          ORIGIN: ${{ secrets.SSH_HOSTNAME }}
          SSHKEY: ${{ secrets.SSH_KEY }}
          NAME: ferron-servers
          PORT: ${{ secrets.SSH_PORT }}
          USER: ${{ secrets.SSH_USERNAME }}

      - name: Release Ferron on Ferron's servers (non-Windows)
        if: ${{ !contains(matrix.target, 'windows') }}
        shell: bash
        run: |
          ssh ferron-servers "mkdir -p ferron3 || true"
          scp dist/ferron+fips-${{ env.FERRON_VERSION }}-${{ matrix.target }}.tar.gz ferron-servers:ferron3/ferron+fips-${{ env.FERRON_VERSION }}-${{ matrix.target }}.tar.gz
          scp dist/ferron+fips-${{ env.FERRON_VERSION }}-${{ matrix.target }}-sbom.tar.gz ferron-servers:ferron3/ferron+fips-${{ env.FERRON_VERSION }}-${{ matrix.target }}-sbom.tar.gz

          # Call the internal "deploy-ferron3" shell script
          ssh ferron-servers "/usr/bin/sudo-rs deploy-ferron3 archive-fips ferron3/ferron+fips-${{ env.FERRON_VERSION }}-${{ matrix.target }}.tar.gz"
          ssh ferron-servers "/usr/bin/sudo-rs deploy-ferron3 archive-fips ferron3/ferron+fips-${{ env.FERRON_VERSION }}-${{ matrix.target }}-sbom.tar.gz"

      - name: Release Ferron on Ferron's servers (Windows)
        if: contains(matrix.target, 'windows')
        shell: bash
        run: |
          ssh ferron-servers "mkdir -p ferron3 || true"
          scp dist/ferron+fips-${{ env.FERRON_VERSION }}-${{ matrix.target }}.zip ferron-servers:ferron3/ferron+fips-${{ env.FERRON_VERSION }}-${{ matrix.target }}.zip
          scp dist/ferron+fips-${{ env.FERRON_VERSION }}-${{ matrix.target }}-sbom.zip ferron-servers:ferron3/ferron+fips-${{ env.FERRON_VERSION }}-${{ matrix.target }}-sbom.zip
          scp dist/ferron+fips-${{ env.FERRON_VERSION }}-${{ matrix.target }}-setup.exe ferron-servers:ferron3/ferron+fips-${{ env.FERRON_VERSION }}-${{ matrix.target }}-setup.exe

          # Call the internal "deploy-ferron3" shell script
          ssh ferron-servers "/usr/bin/sudo-rs deploy-ferron3 archive-fips ferron3/ferron+fips-${{ env.FERRON_VERSION }}-${{ matrix.target }}.zip"
          ssh ferron-servers "/usr/bin/sudo-rs deploy-ferron3 archive-fips ferron3/ferron+fips-${{ env.FERRON_VERSION }}-${{ matrix.target }}-sbom.zip"
          ssh ferron-servers "/usr/bin/sudo-rs deploy-ferron3 archive-fips ferron3/ferron+fips-${{ env.FERRON_VERSION }}-${{ matrix.target }}-setup.exe"

      - name: Build and release Debian package
        if: matrix.runner == 'ubuntu-latest' && contains(matrix.target, 'linux-gnu')
        shell: bash
        run: |
          just package-deb ${{ matrix.target }} true

          DEB_FILE_NAME_WO_DEB=$(ls dist/*.deb | head -n 1 | sed -E 's|^dist/||' | sed -E 's/\.deb$//')
          DEB_PACKAGE_VERSION=$(echo $DEB_FILE_NAME_WO_DEB | cut -d'_' -f2)
          DEB_ARCHITECTURE=$(echo $DEB_FILE_NAME_WO_DEB | cut -d'_' -f3)
          ssh ferron-servers "mkdir -p ferron3 || true"
          scp dist/ferron3-fips_${DEB_PACKAGE_VERSION}_${DEB_ARCHITECTURE}.deb ferron-servers:ferron3/ferron3-fips_${DEB_PACKAGE_VERSION}_${DEB_ARCHITECTURE}.deb

          # Call the internal "deploy-ferron3" shell script
          ssh ferron-servers "/usr/bin/sudo-rs deploy-ferron3 debian ferron3/ferron3-fips_${DEB_PACKAGE_VERSION}_${DEB_ARCHITECTURE}.deb"

      - name: Build and release RPM package
        if: matrix.runner == 'ubuntu-latest' && contains(matrix.target, 'linux-gnu')
        shell: bash
        run: |
          just package-rpm ${{ matrix.target }} true

          RPM_FILE_NAME_WO_RPM=$(ls dist/*.rpm | head -n 1 | sed -E 's|^dist/||' | sed -E 's/\.rpm$//')
          RPM_PACKAGE_VERSION=$(echo $RPM_FILE_NAME_WO_RPM | cut -d'-' -f3)
          RPM_ARCHITECTURE=$(echo $RPM_FILE_NAME_WO_RPM | rev | cut -d'.' -f1 | rev)
          ssh ferron-servers "mkdir -p ferron3 || true"
          scp dist/${RPM_FILE_NAME_WO_RPM}.rpm ferron-servers:ferron3/${RPM_FILE_NAME_WO_RPM}.rpm

          # Call the internal "deploy-ferron3" shell script
          ssh ferron-servers "/usr/bin/sudo-rs deploy-ferron3 rpm-fips ferron3/${RPM_FILE_NAME_WO_RPM}.rpm"

  docker:
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - group: latest
            dockerfile: ./Dockerfile
            platforms: linux/amd64,linux/arm64
          - group: alpine
            dockerfile: ./Dockerfile.alpine
            platforms: linux/amd64,linux/arm64
          - group: debian
            dockerfile: ./Dockerfile.debian
            platforms: linux/amd64,linux/arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: 3.x
          fetch-depth: 0
          submodules: recursive

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.2.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Ferron version
        shell: bash
        run: |
          FERRON_VERSION_CARGO="$(cat entrypoint/Cargo.toml | grep -E '^version' | sed -E 's|.*"([0-9a-zA-Z.+-]+)"$|\1|g')"
          FERRON_VERSION_GIT="$(git tag --sort=-committerdate | head -n 1 | sed s/[^0-9a-zA-Z.+-]//g)"
          if [ "$FERRON_VERSION_CARGO" != "" ]; then
            echo "Version determined from Cargo.toml file"
            echo "FERRON_VERSION=$FERRON_VERSION_CARGO" >> $GITHUB_ENV
          elif  [ "$FERRON_VERSION_GIT" != "" ]; then
            echo "Version determined from the Git tag"
            echo "FERRON_VERSION=$FERRON_VERSION_GIT" >> $GITHUB_ENV
          else
            echo "Can't determine the server version!" 2>&1
            exit 1
          fi

      - name: Determine Docker tags
        shell: bash
        run: |
          TAG_TYPE=${{ matrix.group }}
          FERRON_MAJOR_VERSION=$(echo "$FERRON_VERSION" | cut -d '.' -f 1)
          # TODO: Uncomment commented variable settings after stable release of Ferron 3
          if [ "$TAG_TYPE" = "latest" ] || [ "$TAG_TYPE" = "" ]; then
            DOCKER_HUB_TAGS="ferronserver/ferron:$FERRON_VERSION-fips,ferronserver/ferron:$FERRON_MAJOR_VERSION-fips"
            DOCKER_GHCR_TAGS="ghcr.io/ferronweb/ferron:$FERRON_VERSION-fips,ghcr.io/ferronweb/ferron:$FERRON_MAJOR_VERSION-fips"
            #DOCKER_HUB_TAGS="ferronserver/ferron:$FERRON_VERSION-fips,ferronserver/ferron:$FERRON_MAJOR_VERSION-fips,ferronserver/ferron:fips"
            #DOCKER_GHCR_TAGS="ghcr.io/ferronweb/ferron:$FERRON_VERSION-fips,ghcr.io/ferronweb/ferron:$FERRON_MAJOR_VERSION-fips,ghcr.io/ferronweb/ferron:fips"
          else
            DOCKER_HUB_TAGS="ferronserver/ferron:$FERRON_VERSION-$TAG_TYPE-fips,ferronserver/ferron:$FERRON_MAJOR_VERSION-$TAG_TYPE-fips"
            DOCKER_GHCR_TAGS="ghcr.io/ferronweb/ferron:$FERRON_VERSION-$TAG_TYPE-fips,ghcr.io/ferronweb/ferron:$FERRON_MAJOR_VERSION-$TAG_TYPE-fips"
            #DOCKER_HUB_TAGS="ferronserver/ferron:$FERRON_VERSION-$TAG_TYPE-fips,ferronserver/ferron:$FERRON_MAJOR_VERSION-$TAG_TYPE-fips,ferronserver/ferron:$TAG_TYPE-fips"
            #DOCKER_GHCR_TAGS="ghcr.io/ferronweb/ferron:$FERRON_VERSION-$TAG_TYPE-fips,ghcr.io/ferronweb/ferron:$FERRON_MAJOR_VERSION-$TAG_TYPE-fips,ghcr.io/ferronweb/ferron:$TAG_TYPE-fips"
          fi
          echo "DOCKER_TAGS=$DOCKER_HUB_TAGS,$DOCKER_GHCR_TAGS" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ env.DOCKER_TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            FIPS=1

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: index.docker.io/ferronserver/ferron
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
