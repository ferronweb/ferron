[workspace]
resolver = "2"
members = [
    "bin",
    "core",
    "entrypoint",
    "modules/*",
    "types/*",
    "utils/*"
]
exclude = [
    "doctest",
    "e2e",
    # Fuzzing targets
    "modules/http-server/fuzz",
    "modules/http-ratelimit/fuzz"
]

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
