[dev-dependencies]
aes = "0.9"
brotli = "8.0.2"
cbc = "0.2"
flate2 = "1.1.9"
futures-util = "0.3.31"
getrandom = "0.4"
glob = "0.3.3"
h3 = "0.0.8"
h3-quinn = "0.0.10"
hmac = "0.13"
http = "1.4.0"
password-auth = "1.0.0"
prost = "0.14"
quinn = "0.11.9"
rasn = "0.28"
rasn-ocsp = "0.28"
rcgen = "0.14.7"
reqwest = { version = "0.13.2", default-features = false, features = ["http2", "rustls-no-provider", "cookies"] }
rustls = { version = "0.23.37", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pki-types = "1.14.0"
serde_json = "1.0.149"
sha1 = "0.11"
sha2 = "0.11"
tempfile = "3.27.0"
testcontainers = { version = "0.27.2", features = ["http_wait_plain", "reusable-containers"] }
tokio = { version = "1.50.0", features = ["full"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = "0.29.0"
x509-parser = "0.18.0"
zstd = "0.13.3"
