[package]
name = "e2e"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
reqwest = { version = "0.13.2", default-features = false, features = ["http2", "rustls-no-provider"] }
tempfile = "3.27.0"
testcontainers = { version = "0.27.2", features = ["http_wait_plain", "reusable-containers"] }
tokio = { version = "1.50.0", features = ["full"] }
flate2 = "1.1.9"
password-auth = "1.0.0"
brotli = "8.0.2"
zstd = "0.13.3"
rcgen = "0.14.7"
h3 = "0.0.8"
quinn = "0.11.9"
h3-quinn = "0.0.10"
rustls = { version = "0.23.37", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pki-types = "1.14.0"
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
http = "1.4.0"
tokio-tungstenite = "0.29.0"
futures-util = "0.3.31"
tonic = "0.14"
prost = "0.14"
glob = "0.3.3"
rasn = "0.28"
rasn-ocsp = "0.28"
x509-parser = "0.18.0"
sha2 = "0.11"
sha1 = "0.11"
serde_json = "1.0.149"
getrandom = "0.4"
aes = "0.9"
cbc = "0.2"
block-padding = "0.4"
hmac = "0.13"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.2", features = ["fs"] }

[build-dependencies]
tonic-build = "0.14"
prost-build = "0.14"

[[test]]
name = "acme"
path = "tests/acme.rs"

[[test]]
name = "admin"
path = "tests/admin.rs"

