[package]
name = "e2e"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.31.2", features = ["fs"] }

[build-dependencies]
prost-build = "0.14"

