# Ferron test configuration for soak/chaos testing
# This configuration enables OTLP export and Prometheus metrics collection

*:80 {
    # Root for simple test serving
    root "/var/www/ferron"
    directory_listing

    # Prometheus metrics endpoint (default: 127.0.0.1:8889)
    observability {
        provider prometheus
        endpoint_listen "0.0.0.0:8889"
        endpoint_format text
    }

    # OTLP export (traces, metrics, and logs to collector)
    observability {
        provider otlp
        service_name "ferron-soak-test"

        traces "http://otel-collector:4317" {
            protocol "grpc"
        }

        logs "http://otel-collector:4318/v1/logs" {
            protocol "http/protobuf"
        }

        metrics "http://otel-collector:4318/v1/metrics" {
            protocol "http/protobuf"
        }
    }

    # Access logging in JSON format
    log "/tmp/access.log" {
        format json
        fields "method" "path" "status" "duration_secs" "client_ip"
    }
}
