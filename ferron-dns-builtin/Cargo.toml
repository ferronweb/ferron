[package]
name = "ferron-dns-builtin"
version = "2.8.1"
edition = "2021"

[dependencies]
ferron-common = { workspace = true }
dns-update-lite = { version = "0.5.9", optional = true, default-features = false, features = [
    "aws-lc-rs",
    "native-tokio",
] }
aws-config = { version = "1.8.1", optional = true, default-features = false, features = [
    "default-https-client", # This feature flag enables aws-lc-rs crypto provider
    "rt-tokio",
] } # Needed for Route53
aws-credential-types = { version = "1.2.3", optional = true, features = [
    "hardcoded-credentials",
] } # Needed for Route53
aws-sdk-route53 = { version = "1.84.0", optional = true, default-features = false, features = [
    "default-https-client", # This feature flag enables aws-lc-rs crypto provider
    "rt-tokio",
] }
tokio = { version = "1.47.0", default-features = false, features = [
    "rt",
    "sync",
] }
async-trait = "0.1.88"
anyhow = "1.0.98"
base64 = { version = "0.22.1", optional = true }
hyper = { version = "1.9.0", optional = true }

[features]
default = ["bunny", "cloudflare", "desec", "digitalocean", "dnsimple", "googlecloud", "ovh", "porkbun", "rfc2136", "route53", "spaceship"]
bunny = ["dns-update-lite"]
cloudflare = ["dns-update-lite"]
desec = ["dns-update-lite"]
digitalocean = ["dns-update-lite"]
dnsimple = ["dns-update-lite"]
googlecloud = ["dns-update-lite"]
ovh = ["dns-update-lite"]
porkbun = ["dns-update-lite"]
rfc2136 = ["dns-update-lite", "base64", "hyper"]
route53 = ["aws-config", "aws-credential-types", "aws-sdk-route53"]
spaceship = ["dns-update-lite"]
