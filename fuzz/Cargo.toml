[package]
name = "ferron-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
http = "1"
bytes = "1"
httparse = "1"
tokio = { version = "1", features = ["rt", "macros"] }
ppp = "2.3.0"
dashmap = "6.2.1"
rustc-hash = "2"
ahash = "0.8"
cidr = "0.2"

ferron-http = { path = "../types/http" }
ferron-http-server = { path = "../modules/http-server", features = ["fuzz"] }
ferron-http-proxy = { path = "../modules/http-proxy", features = ["fuzz"] }
ferron-http-cache = { path = "../modules/http-cache", features = ["fuzz"] }
ferron-http-ratelimit = { path = "../modules/http-ratelimit", features = ["fuzz"] }
ferron-core = { path = "../core" }
ferron-observability = { path = "../types/observability" }
http-body-util = "0.1"

[[bin]]
name = "fuzz_http_pipeline"
path = "fuzz_targets/fuzz_http_pipeline.rs"
test = false
doc = false

[[bin]]
name = "fuzz_canonicalize_path"
path = "fuzz_targets/fuzz_canonicalize_path.rs"
test = false
doc = false

[[bin]]
name = "fuzz_canonicalize_path_routing"
path = "fuzz_targets/fuzz_canonicalize_path_routing.rs"
test = false
doc = false

[[bin]]
name = "fuzz_load_balancers"
path = "fuzz_targets/fuzz_load_balancers.rs"
test = false
doc = false

[[bin]]
name = "fuzz_cache"
path = "fuzz_targets/fuzz_cache.rs"
test = false
doc = false

[[bin]]
name = "fuzz_ratelimit"
path = "fuzz_targets/fuzz_ratelimit.rs"
test = false
doc = false

[[bin]]
name = "fuzz_traceparent"
path = "fuzz_targets/fuzz_traceparent.rs"
test = false
doc = false

[[bin]]
name = "fuzz_qvalue"
path = "fuzz_targets/fuzz_qvalue.rs"
test = false
doc = false
