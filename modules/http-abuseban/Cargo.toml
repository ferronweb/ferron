[package]
name = "ferron-http-abuseban"
version = "3.0.0-beta.2"
edition = "2021"

[dependencies]
async-trait = "0.1"
dashmap = "6"
http = "1"
cidr = "0.3"
rustc-hash = "2"

ferron-core = { path = "../../core" }
ferron-http = { path = "../../types/http", features = ["abuse"] }
ferron-observability = { path = "../../types/observability" }
typemap_rev = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
http-body-util = "0.1.3"
bytes = "1"
typemap_rev = "0.4"
