[package]
name = "ferron-http-basicauth"
version = "3.0.0-beta.11"
edition = "2021"

[dependencies]
async-trait = "0.1"
zincio = { version = "0.2.22", default-features = false }
dashmap = "6.2.1"
http = "1"
http-body-util = "0.1"
bytes = "1"
base64 = "0.23"
aws-lc-rs = { version = "1", features = ["bindgen"] }
aws-lc-sys = "0"
tokio = { version = "1", features = ["sync"] }
rustc-hash = "2"

ferron-core = { path = "../../core" }
ferron-http = { path = "../../types/http", features = ["abuse"] }
ferron-observability = { path = "../../types/observability" }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
ferron-observability = { path = "../../types/observability" }
argon2 = "0.5.3"

[build-dependencies]
find_git = "1.2.1"
cc = "1.4.2"
bindgen = "0.72.1"

[features]
fips = ["aws-lc-rs/fips"]
