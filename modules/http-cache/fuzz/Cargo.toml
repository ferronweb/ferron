[package]
name = "ferron-http-cache-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = "1"
ferron-http-cache = { path = "..", features = ["fuzz"] }
http = "1"
ahash = "0.8"
bytes = "1"

[[bin]]
name = "lscache_parsers"
path = "fuzz_targets/lscache_parsers.rs"
test = false
required-features = []

[[bin]]
name = "policy_evaluation"
path = "fuzz_targets/policy_evaluation.rs"
test = false
required-features = []

[[bin]]
name = "cache_key_roundtrip"
path = "fuzz_targets/cache_key_roundtrip.rs"
test = false
required-features = []
