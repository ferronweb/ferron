[package]
name = "ferron-http-canary"
version = "3.0.0-beta.11"
edition = "2021"

[dependencies]
rustc-hash = "2.1"
async-trait = "0.1"
ahash = "0.8"
http = "1"
parking_lot = "0.12"
rand = "0.10"
typemap_rev = "0.4"

ferron-core = { path = "../../core" }
ferron-http = { path = "../../types/http" }
ferron-observability = { path = "../../types/observability" }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
bytes = "1"
http-body-util = "0.1.3"
