[package]
name = "ferron-http-proxy"
version = "3.0.0-rc.2"
edition = "2021"

[dependencies]
arrayvec = "0.7"
async-trait = "0.1"
zincio = { version = "0.2.22", default-features = false, features = ["time"] }
zincio-hyper = { version = "0.2.22" }
zincio-http = { version = "0.4.2", default-features = false, features = ["h1"] }
hyper = { version = "1", features = ["client", "http1", "http2"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
ferron-core = { path = "../../core" }
ferron-http = { path = "../../types/http" }
ferron-observability = { path = "../../types/observability" }
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "io-util", "sync", "macros", "time"] }
tokio-rustls = { version = "0.26", default-features = false }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-native-certs = "0.8"
webpki-roots = "1.0"
rand = "0.10"
ahash = "0.8"
hickory-resolver = "0.26"
hickory-proto = "0.26"
parking_lot = "0.12"
ppp = "2.2"
rustc-hash = "2.1.2"
dashmap = "6.2.1"
tokio-util = "0.7.18"
crossbeam-queue = "0.3.12"
arc-swap = "1.9.1"

[features]
default = []
fuzz = []
