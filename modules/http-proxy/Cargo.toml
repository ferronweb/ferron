[package]
name = "ferron-http-proxy"
version = "3.0.0-beta.5"
edition = "2021"

[dependencies]
arrayvec = "0.7"
async-trait = "0.1"
vibeio = { version = "0.2.6", default-features = false, features = ["time"] }
vibeio-hyper = { version = "0.2.7" }
vibeio-http = { version = "0.3.0", default-features = false, features = ["h1"] }
hyper = { version = "1", features = ["client", "http1", "http2"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
ferron-core = { path = "../../core" }
ferron-http = { path = "../../types/http" }
ferron-observability = { path = "../../types/observability" }
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "io-util", "sync", "macros", "time"] }
tokio-rustls = "0.26"
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
hyper-rustls = { version = "0.27", features = ["http1", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-native-certs = "0.8"
webpki-roots = "1.0"
rand = "0.10"
ahash = "0.8"
hickory-resolver = { version = "0.26", optional = true }
hickory-proto = { version = "0.26", optional = true }
parking_lot = "0.12"
ppp = "2.2"
rustc-hash = "2.1.2"
dashmap = "6.2.1"
tokio-util = "0.7.18"
crossbeam-queue = "0.3.12"
arc-swap = "1.9.1"

[features]
default = ["srv-lookup"]
srv-lookup = ["hickory-resolver", "hickory-proto"]
fuzz = []
