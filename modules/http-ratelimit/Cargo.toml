[package]
name = "ferron-http-ratelimit"
version = "3.0.0-beta.5"
edition = "2021"

[features]
bench = []
fuzz = []

[dependencies]
async-trait = "0.1"
parking_lot = "0.12"
dashmap = "6"
http = "1"
http-body-util = "0.1.3"
bytes = "1"
rustc-hash = "2"

ferron-core = { path = "../../core" }
ferron-http = { path = "../../types/http", features = ["abuse"] }
ferron-observability = { path = "../../types/observability" }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
ferron-observability = { path = "../../types/observability" }
typemap_rev = "0.4"
