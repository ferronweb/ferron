[package]
name = "ferron-http-response"
version = "3.0.0-beta.11"
edition = "2021"

[dependencies]
async-trait = "0.1"
regex = "1.13.1"
cidr = "0.3"
http = "1"
http-body-util = "0.1.3"
bytes = "1"
rustc-hash = "2"
zincio-http = { version = "0.4.2", default-features = false, features = ["h1"] }

ferron-core = { path = "../../core" }
ferron-http = { path = "../../types/http" }
ferron-observability = { path = "../../types/observability" }
dashmap = "6.1.0"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
ferron-observability = { path = "../../types/observability" }
