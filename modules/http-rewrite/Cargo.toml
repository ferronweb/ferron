[package]
name = "ferron-http-rewrite"
version = "3.0.0-beta.9"
edition = "2021"

[dependencies]
async-trait = "0.1"
fancy-regex = "0.19"
tokio = { version = "1", features = ["fs"] }
http = "1"
rustc-hash = "2"
dashmap = "6.1.0"
vibeio = { version = "0.2", default-features = false, features = ["fs"] }

ferron-core = { path = "../../core" }
ferron-http = { path = "../../types/http" }
ferron-observability = { path = "../../types/observability" }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
typemap_rev = "0.4"
bytes = "1"
http-body-util = "0.1.3"
