[package]
name = "ferron-observability-otlp"
version = "3.0.0-beta.8"
edition = "2021"

[dependencies]
ferron-observability = { path = "../../types/observability" }
ferron-core = { path = "../../core" }
async-channel = "2.5.0"
tokio-util = "0.7.18"
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread"] }
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2"] }
tonic = "0.14"
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs"] }
rustls-native-certs = "0.8"
webpki-roots = "1.0"
async-trait = "0.1"
bytes = "1"
http = "1"
http-body-util = "0.1"
urlencoding = "2.1.3"
lru = "0.18.0"

# New libraries for custom OTLP exporter logic
prost = "0.14.4"
tonic-prost = "0.14.4"
pbjson = "0.9"
serde = "1"
serde_json = "1"
base64 = "0.23"
hex = "0.4"

# TODO: remove the libraries below after migration
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = [
  "logs",
  "metrics",
  "trace",
  "grpc-tonic",
  "http-proto",
  "http-json",
  "hyper-client"
]}
opentelemetry-http = { version = "0.32.0", default-features = false, features = [
  "hyper"
]}
opentelemetry_sdk = { version = "0.32.0", default-features = false, features = [
  "logs",
  "metrics",
  "trace",
  "spec_unstable_metrics_views",
  "experimental_logs_batch_log_processor_with_async_runtime",
  "experimental_metrics_periodicreader_with_async_runtime",
  "experimental_trace_batch_span_processor_with_async_runtime",
  "rt-tokio"
]}
opentelemetry = { version = "0.32.0", default-features = false, features = [
  "logs",
  "metrics",
  "trace"
]}

[build-dependencies]
git2 = "0.21"
protox = "0.9.1"
tonic-prost-build = "0.14.6"
pbjson-build = "0.9"

[dev-dependencies]
hyper = { version = "1", features = ["server", "http1"] }
tokio-stream = { version = "0.1", features = ["net"] }

[package.metadata.cargo-shear]
ignored = ["prost", "tonic-prost"]
