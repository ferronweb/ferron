[package]
name = "ferron-observability-prometheus"
version = "3.0.0-beta.6"
edition = "2021"

[dependencies]
ferron-observability = { path = "../../types/observability" }
ferron-core = { path = "../../core" }

axum = "0.8"
async-channel = "2.5.0"
http = "1"
tokio = { version = "1", features = ["net", "rt", "sync", "macros"] }
tokio-util = "0.7"
prometheus-client = { version = "0.25.0", features = ["prometheus_protobuf", "protobuf-protox"] }
subtle = "2.6.1"
