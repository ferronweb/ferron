[package]
name = "ferron-tls-local"
version = "3.0.0-beta.11"
edition = "2021"

[dependencies]
async-trait = "0.1"
rustls = { version = "0.23.37", default-features = false, features = ["tls12", "std", "aws_lc_rs"] }
rustls-pki-types = "1.14.0"
rcgen = { version = "0.14.1", default-features = false, features = ["crypto", "aws_lc_rs", "pem"] }
dirs = "6.0"
ferron-core = { path = "../../core" }
ferron-observability = { path = "../../types/observability" }
ferron-ocsp = { path = "../../types/ocsp" }
ferron-tls = { path = "../../types/tls", features = ["observability"] }
time = "0.3"
rasn = "0.28.13"
rasn-pkix = "0.28.13"
anyhow = "1.0.102"
tempfile = "3"
chrono = "0.4.45"
