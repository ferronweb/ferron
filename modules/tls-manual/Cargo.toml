[package]
name = "ferron-tls-manual"
version = "3.0.0-beta.8"
edition = "2021"

[dependencies]
async-trait = "0.1"
rustls = { version = "0.23.37", default-features = false, features = ["tls12", "std", "aws_lc_rs"] }

ferron-core = { path = "../../core" }
ferron-observability = { path = "../../types/observability" }
ferron-ocsp = { path = "../../types/ocsp" }
ferron-tls = { path = "../../types/tls", features = ["observability"] }
rustls-pki-types = "1.14.0"
rasn = "0.28.13"
rasn-pkix = "0.28.13"
num-traits = "0.2.19"
