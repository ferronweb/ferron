*:80 {
    proxy http://bad-backend:8000 {
        keepalive true
    }

    # Prometheus metrics for local scraping
    observability {
        provider prometheus
        endpoint_listen "0.0.0.0:8889"
        endpoint_format text
    }

    # OTLP export to collector (used by chaos experiments)
    observability {
        provider otlp
        service_name "ferron-chaos-test"

        traces "http://otel-collector:4318/v1/traces" {
            protocol "http/protobuf"
        }
        logs "http://otel-collector:4318/v1/logs" {
            protocol "http/protobuf"
        }
        metrics "http://otel-collector:4318/v1/metrics" {
            protocol "http/protobuf"
        }
    }
}
