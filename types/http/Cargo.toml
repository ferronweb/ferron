[package]
name = "ferron-http"
version = "3.0.0-rc.1"
edition = "2021"

[dependencies]
http = "1"
http-body-util = "0.1.3"
bytes = "1.11.1"
zincio = { version = "0.2.22", default-features = false, features = ["fs"] }
typemap_rev = "0.4"
rustc-hash = "2"
rand = "0.10"
cidr = "0.3"
rustls-pki-types = { version = "1.14.1", optional = true }
hex = "0.4.3"
rasn = "0.28.13"
rasn-pkix = "0.28.13"
urlencoding = "2.1.3"

ferron-observability = { path = "../../types/observability" }
ferron-core = { path = "../../core" }

[features]
util = []
abuse = []
mtls = ["rustls-pki-types"]
