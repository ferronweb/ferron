[package]
name = "ferron-observability"
version = "3.0.0-beta.10"
edition = "2021"

[dependencies]
rustc-hash = "2.1"
ferron-core = { path = "../../core" }
urlencoding = "2.1.3"
xxhash-rust = { version = "0.8.15", features = ["xxh3", "std"] }
async-channel = { version = "2", optional = true }
tokio-util = { version = "0.7", optional = true }

[features]
module = ["async-channel", "tokio-util"]
